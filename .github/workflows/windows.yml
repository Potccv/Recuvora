name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure external paths and install the pinned Rust toolchain
        run: |
          $taskBuildRoot = Join-Path $env:RUNNER_TEMP 'recuvora-build'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value @(
            "CARGO_HOME=$(Join-Path $env:RUNNER_TEMP 'recuvora-cargo')"
            "CARGO_TARGET_DIR=$(Join-Path $taskBuildRoot 'cargo')"
            "RECUVORA_UI_BUILD_DIR=$taskBuildRoot"
            "RECUVORA_TEST_TEMP=$(Join-Path $env:RUNNER_TEMP 'recuvora-tests')"
          )
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
      - name: Check host and legacy compatibility
        run: ./scripts/check.ps1 -BuildDir $env:CARGO_TARGET_DIR -TempRoot $env:RECUVORA_TEST_TEMP
      - name: Build and check shared Web and Desktop UI
        run: ./scripts/check-ui.ps1 -BuildDir $env:RECUVORA_UI_BUILD_DIR
      - name: Verify source tree and test cleanup
        if: always()
        run: |
          $changes = @(git status --porcelain --untracked-files=all --ignored)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source tree.' }
          if ($changes.Count -gt 0) { throw "Checks modified the source tree: $($changes -join ', ')" }
          if (Test-Path -LiteralPath $env:RECUVORA_TEST_TEMP) {
            $remaining = @(Get-ChildItem -LiteralPath $env:RECUVORA_TEST_TEMP -Force)
            if ($remaining.Count -gt 0) { throw 'Tests left temporary resources behind.' }
          }
